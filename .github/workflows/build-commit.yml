name: Build et commit des fichiers générés

# Lance « npm run build » sur une branche et commite les fichiers générés (?v=, blog, sitemap…),
# pour ne jamais lancer le build sur le PC partagé. Le commit est poussé avec GITHUB_TOKEN :
# il ne relance pas la CI, pousser ensuite un commit (même vide) pour la déclencher.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Commit des fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Rien à commiter."; exit 0; }
          git commit -m "build: fichiers générés (workflow build-commit)"
          git push
