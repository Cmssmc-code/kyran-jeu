name: Contrôles du site

# JSON-LD valide, articles du blog (structure + doublons), cohérence du site
# (canoniques, liens, sitemap, redirections) et tests de sécurité.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées sur un SHA de commit (les tags peuvent être déplacés)
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configuration de Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 22 : `node --test` y interprète les motifs glob de `npm run test:security` (Node 20 non)
          node-version: '22'

      - name: Installation des dépendances (versions verrouillées)
        run: npm ci --ignore-scripts

      - name: JSON-LD valide sur toutes les pages
        run: npm run check:jsonld

      - name: Articles du blog (structure, longueurs, doublons)
        run: npm run validate:blog

      - name: Cohérence du site (canoniques, liens, sitemap, redirections)
        run: npm run check:site

      - name: Pas de contenu dupliqué entre les pages publiées
        run: npm run check:duplicates

      - name: Les fichiers générés sont à jour
        run: |
          npm run build
          git diff --exit-code -- . ':(exclude)scripts/lastmod-manifest.json' \
            || { echo "::error::Fichiers générés obsolètes : lancer « npm run build » et commiter le résultat."; exit 1; }

      - name: Tests de sécurité
        run: npm run test:security
