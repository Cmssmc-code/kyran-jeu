name: Notification IndexNow (Bing, Copilot)

# À chaque publication sur la branche de production, envoie à IndexNow les pages HTML
# modifiées par le push. Lancement manuel possible pour renvoyer tout le sitemap.
# La clé (fichier <clé>.txt à la racine du site) est publique par conception.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Envoyer toutes les URLs du sitemap"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions épinglées sur un SHA de commit (les tags peuvent être déplacés)
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configuration de Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Envoi à IndexNow (attend que la clé soit en ligne)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/indexnow.mjs --all --wait
          else
            node scripts/indexnow.mjs --changed "$BEFORE" "$SHA" --wait
          fi
