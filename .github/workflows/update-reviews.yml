name: Synchronisation automatique des avis Amazon

on:
  # Cron désactivé car les runners GitHub sont bloqués par les captchas Amazon
  # schedule:
  #   - cron: '0 4 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

# Aucune permission par défaut ; seul le job ci-dessous peut écrire le contenu du dépôt
permissions: {}

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write # relancer la publication Pages après mise à jour des avis

    steps:
      # Actions épinglées sur un SHA de commit (les tags peuvent être déplacés)
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le token n'est pas laissé dans .git/config pendant l'exécution du scraper
          persist-credentials: false

      - name: Configuration de Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Installation des dépendances (versions verrouillées)
        run: npm ci --ignore-scripts

      - name: Récupération des avis Amazon
        run: node scripts/fetch-amazon-reviews.mjs
        continue-on-error: true

      - name: Mise à jour du rendu statique des avis (pages index et commander)
        run: node scripts/prerender.mjs

      - name: Commit et Push si de nouveaux avis sont détectés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews-data.json reviews-data.js index.html commander.html
          if git diff --staged --quiet; then
            echo "Aucune modification des avis Amazon."
          else
            git commit -m "chore(reviews): mise à jour automatique des avis Amazon [skip ci]"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            # Un push fait avec GITHUB_TOKEN ne déclenche pas d'autre workflow : on relance
            # explicitement la publication (sans effet tant que Pages n'est pas en mode Actions)
            gh workflow run pages.yml --ref "${GITHUB_REF_NAME}" || echo "::warning::Relance de pages.yml impossible"
          fi
