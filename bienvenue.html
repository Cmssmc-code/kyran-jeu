<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; media-src 'self'; connect-src 'self' https://kyran-webhook-production.up.railway.app https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <script src="/error-reporter.js?v=9891fdac0f" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KYRAN</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://kyran-jeu.fr/" />
  <!--
    Porte d'entrée des QR des festivals (permanente) : redirection immédiate vers l'accueil.
    Les utm du QR sont gardés ; ceux qui manquent prennent les valeurs ci-dessous.
    D'un festival à l'autre, seule FESTIVAL_CAMPAIGN change.
    Le repère festival=1 (sessionStorage kyranFestival) sert aux statistiques (components.js).
  -->
  <script>
    (function () {
      var FESTIVAL_CAMPAIGN = 'carrieres-2026-11';
      var params = new URLSearchParams(location.search);
      if (!params.get('utm_source')) params.set('utm_source', 'festival');
      if (!params.get('utm_medium')) params.set('utm_medium', 'qr');
      if (!params.get('utm_campaign')) params.set('utm_campaign', FESTIVAL_CAMPAIGN);
      params.set('festival', '1');
      try { sessionStorage.setItem('kyranFestival', '1'); } catch (e) { /* stockage indisponible : le paramètre suffit */ }
      location.replace('/?' + params.toString());
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/" />
</head>
<body>
  <p><a href="/">Aller sur kyran-jeu.fr</a></p>
</body>
</html>
