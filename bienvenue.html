<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KYRAN</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://kyran-jeu.fr/" />
  <!--
    Porte d'entrée des QR des festivals (permanente) : redirection immédiate vers l'accueil.
    Les utm du QR sont gardés ; ceux qui manquent prennent les valeurs ci-dessous.
    D'un festival à l'autre, seule FESTIVAL_CAMPAIGN change.
    Le repère festival=1 ouvre, au bouton d'achat, le choix « en main propre » ou « livraison »
    (components.js) : permanent, décision de Corentin du 20/11/2026.
  -->
  <script>
    (function () {
      var FESTIVAL_CAMPAIGN = 'carrieres-2026-11';
      var params = new URLSearchParams(location.search);
      if (!params.get('utm_source')) params.set('utm_source', 'festival');
      if (!params.get('utm_medium')) params.set('utm_medium', 'qr');
      if (!params.get('utm_campaign')) params.set('utm_campaign', FESTIVAL_CAMPAIGN);
      params.set('festival', '1');
      try { sessionStorage.setItem('kyranFestival', '1'); } catch (e) { /* stockage indisponible : le paramètre suffit */ }
      location.replace('/?' + params.toString());
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/?utm_source=festival&amp;utm_medium=qr&amp;utm_campaign=carrieres-2026-11&amp;festival=1" />
</head>
<body>
  <p><a href="/?utm_source=festival&amp;utm_medium=qr&amp;utm_campaign=carrieres-2026-11&amp;festival=1">Aller sur kyran-jeu.fr</a></p>
</body>
</html>
