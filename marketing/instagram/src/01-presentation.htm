<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>01 · Présentation de KYRAN</title>
<link rel="stylesheet" href="commun.css">
<style>
  body { background: var(--saffron); }
  .wax-side { position: absolute; top: 0; bottom: 0; width: 300px; background: url('../../../img/motif-wax.svg') center / cover; opacity: 1; }
  .wax-side.right { right: -40px; }
  .halo { position: absolute; width: 820px; height: 820px; right: -260px; top: 470px; border-radius: 50%; background: var(--cream); border: 6px solid var(--ink); }
  .head { position: absolute; left: 72px; top: 110px; width: 620px; z-index: 3; }
  h1 { font-size: 168px; margin-top: 30px; color: var(--ink); }
  .sub { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 54px; line-height: 1.12; margin-top: 14px; }
  .box { position: absolute; width: 470px; right: 90px; top: 560px; z-index: 4; transform: rotate(5deg); filter: drop-shadow(18px 22px 0 rgba(35,31,34,.85)); }
  .facts { position: absolute; left: 72px; top: 690px; z-index: 6; display: flex; flex-direction: column; align-items: flex-start; gap: 28px; }
  .facts .tag { background: var(--cream); font-size: 46px; }
  .facts .tag b { font-weight: 700; }
  .sub2 { font-size: 34px; line-height: 1.35; font-weight: 600; margin-top: 22px; width: 430px; }
  .foot { color: var(--ink); }
</style>
</head>
<body>
<div class="canvas">
  <div class="band top"></div>
  <div class="wax-side right"></div>
  <div class="halo"></div>
  <div class="head">
    <span class="eyebrow">Jeu de cartes</span>
    <h1>KYRAN</h1>
    <p class="sub">Plis, bluff et paris.</p>
    <p class="sub2">Le jeu où il faut gagner le nombre exact de plis annoncés.</p>
  </div>
  <img class="box" src="../../../boite-recto-kyran.png" alt="">
  <div class="facts">
    <span class="tag"><b>3 à 6</b>&nbsp;joueurs</span>
    <span class="tag"><b>30</b>&nbsp;min</span>
    <span class="tag">dès&nbsp;<b>8</b>&nbsp;ans</span>
  </div>
  <div class="foot">
    <span class="brand"><img src="../../../logo.png" alt="">kyran-jeu.fr</span>
  </div>
  <div class="band bottom"></div>
</div>
</body>
</html>
