<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>06 · Dans la boîte</title>
<link rel="stylesheet" href="commun.css">
<style>
  body { background: var(--cream); }
  .head { position: absolute; left: 72px; right: 72px; top: 100px; }
  h1 { font-size: 92px; margin-top: 24px; }
  .box { position: absolute; width: 360px; right: 80px; top: 330px; transform: rotate(6deg); filter: drop-shadow(14px 18px 0 rgba(35,31,34,.85)); z-index: 2; }
  .list { position: absolute; left: 72px; top: 330px; width: 560px; display: flex; flex-direction: column; gap: 18px; z-index: 3; }
  .it { display: flex; align-items: center; gap: 22px; }
  .it b { flex: none; width: 128px; height: 100px; border: 4px solid var(--ink); border-radius: 20px; display: grid; place-items: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 62px; box-shadow: 5px 5px 0 var(--ink); }
  .it span { font-size: 34px; line-height: 1.2; font-weight: 600; }
  .it small { display: block; font-size: 26px; font-weight: 400; }
  .n b { background: var(--blue); color: var(--cream); }
  .m b { background: var(--ink); color: var(--saffron); }
  .pw b { background: var(--kraft); }
  .v b { background: var(--terra); color: var(--cream); }
  .r b { background: var(--saffron); }
  .total { position: absolute; left: 72px; right: 72px; top: 960px; background: var(--ink); color: var(--cream); border-radius: 26px; padding: 26px 34px; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
  .total .big { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: var(--saffron); }
  .total p { font-size: 28px; line-height: 1.35; text-align: right; }
  .foot { bottom: 70px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="band top"></div>
  <div class="head">
    <span class="eyebrow">Dans la boîte</span>
    <h1>Tout pour jouer</h1>
  </div>
  <img class="box" src="../../../boite-recto-kyran.png" alt="">
  <div class="list">
    <div class="it n"><b>36</b><span>cartes Nombre<small>de 1 à 36</small></span></div>
    <div class="it m"><b>1</b><span>carte Mystique</span></div>
    <div class="it pw"><b>8</b><span>cartes Pouvoir</span></div>
    <div class="it v"><b>30</b><span>cartes Vie<small>5 par joueur</small></span></div>
    <div class="it r"><b>7</b><span>cartes de règles</span></div>
  </div>
  <div class="total">
    <span class="big">45 cartes de jeu</span>
    <p>Cartes toilées, boîte rigide<br>11,5 × 8,5 × 2,8&nbsp;cm, 175&nbsp;g</p>
  </div>
  <div class="foot"><span class="brand"><img src="../../../logo.png" alt="">kyran-jeu.fr</span></div>
  <div class="band bottom"></div>
</div>
</body>
</html>
