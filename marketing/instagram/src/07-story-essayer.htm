<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>07 · Story : essayer en ligne</title>
<link rel="stylesheet" href="commun.css">
<style>
  /* Story 1080 × 1920 : aucun texte dans les 250 px du haut et du bas. */
  html, body { height: 1920px; }
  body { background: var(--saffron); }
  .wax-top, .wax-bottom { position: absolute; left: 0; right: 0; height: 250px; background: url('../../../img/motif-wax.svg') center / 1080px auto; }
  .wax-top { top: 0; border-bottom: 6px solid var(--ink); }
  .wax-bottom { bottom: 0; border-top: 6px solid var(--ink); background-position: center bottom; }
  .zone { position: absolute; left: 80px; right: 80px; top: 330px; bottom: 330px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .eyebrow { margin-bottom: 30px; }
  h1 { font-size: 112px; }
  .sub { font-size: 40px; line-height: 1.35; margin-top: 26px; font-weight: 600; }
  .cards { position: relative; width: 760px; height: 470px; margin-top: 46px; }
  .cards img { position: absolute; width: 250px; top: 40px; border-radius: 16px; border: 4px solid var(--ink); box-shadow: 8px 10px 0 var(--ink); }
  .cards img:nth-child(1) { left: 30px; transform: rotate(-12deg); }
  .cards img:nth-child(2) { left: 255px; top: 0; transform: rotate(0deg); z-index: 2; }
  .cards img:nth-child(3) { left: 480px; transform: rotate(12deg); }
  .rows { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .rows .tag { background: var(--cream); font-size: 36px; padding: 14px 26px 12px; }
  .url { margin-top: auto; background: var(--ink); color: var(--cream); border-radius: 26px; padding: 28px 30px 26px; width: 100%; }
  .url small { display: block; font-size: 30px; font-weight: 600; color: var(--saffron); }
  .url b { display: block; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; margin-top: 6px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="wax-top"></div>
  <div class="zone">
    <span class="eyebrow">Initiation</span>
    <h1>Essayez KYRAN gratuitement</h1>
    <p class="sub">En ligne, dans le navigateur,<br>sans inscription.</p>
    <div class="cards">
      <img src="../../../carte-pouvoir-clairvoyance-23.webp" alt="">
      <img src="../../../carte-mystique.webp" alt="">
      <img src="../../../card-16.jpg" alt="">
    </div>
    <div class="rows">
      <span class="tag">7&nbsp;rites guidés</span>
      <span class="tag">Parties contre l’ordinateur</span>
    </div>
    <div class="url"><small>Jouer maintenant sur</small><b>kyran-jeu.fr/minijeu.html</b></div>
  </div>
  <div class="wax-bottom"></div>
</div>
</body>
</html>
