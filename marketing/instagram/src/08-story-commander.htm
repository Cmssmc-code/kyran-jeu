<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>08 · Story : note Amazon et commande</title>
<link rel="stylesheet" href="commun.css">
<style>
  /* Story 1080 × 1920 : aucun texte dans les 250 px du haut et du bas. */
  html, body { height: 1920px; }
  body { background: var(--cream); }
  .wax-top, .wax-bottom { position: absolute; left: 0; right: 0; height: 250px; background: url('../../../img/motif-wax.svg') center / 1080px auto; }
  .wax-top { top: 0; border-bottom: 6px solid var(--ink); }
  .wax-bottom { bottom: 0; border-top: 6px solid var(--ink); background-position: center bottom; }
  .zone { position: absolute; left: 80px; right: 80px; top: 320px; bottom: 320px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .rating { background: var(--ink); color: var(--cream); border-radius: 30px; padding: 30px 40px 30px; width: 100%; }
  .stars { display: flex; justify-content: center; gap: 10px; }
  .score { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 104px; line-height: 1; margin-top: 14px; color: var(--saffron); }
  .score span { font-size: 56px; color: var(--cream); }
  .rating p { font-size: 34px; margin-top: 8px; font-weight: 600; }
  .box { width: 340px; margin-top: 50px; transform: rotate(-5deg); filter: drop-shadow(14px 18px 0 rgba(35,31,34,.85)); }
  h1 { font-size: 80px; margin-top: 54px; }
  h1 span { color: var(--terra); }
  .price { margin-top: 40px; display: flex; align-items: center; gap: 24px; }
  .price .tag { font-size: 64px; padding: 14px 34px 10px; font-weight: 700; }
  .price small { font-size: 30px; line-height: 1.3; text-align: left; }
</style>
</head>
<body>
<div class="canvas">
  <div class="wax-top"></div>
  <div class="zone">
    <div class="rating">
      <div class="stars" aria-hidden="true">
        <svg width="78" height="78" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z" fill="#E6AB26"/></svg>
        <svg width="78" height="78" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z" fill="#E6AB26"/></svg>
        <svg width="78" height="78" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z" fill="#E6AB26"/></svg>
        <svg width="78" height="78" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z" fill="#E6AB26"/></svg>
        <!-- 4,7 : la dernière étoile est remplie à 70 % -->
        <svg width="78" height="78" viewBox="0 0 24 24"><defs><linearGradient id="part"><stop offset="0.7" stop-color="#E6AB26"/><stop offset="0.7" stop-color="#8C8488"/></linearGradient></defs><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z" fill="url(#part)"/></svg>
      </div>
      <div class="score">4,7<span>&nbsp;/&nbsp;5</span></div>
      <p>sur Amazon, 33&nbsp;évaluations</p>
    </div>
    <img class="box" src="../../../boite-recto-kyran.png" alt="">
    <h1>Commandez sur<br><span>kyran-jeu.fr</span></h1>
    <div class="price">
      <span class="tag">9,99&nbsp;€</span>
      <small>la boîte<br>+ 2,99&nbsp;€ de port par commande</small>
    </div>
  </div>
  <div class="wax-bottom"></div>
</div>
</body>
</html>
