<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <title>KYRAN – Le Jeu Complet</title>
  <meta name="description" content="Jeu complet KYRAN. Enchaînez 7 manches, survivez à la mort subite et remportez la victoire finale." />
  <meta name="robots" content="noindex" /> 
  <meta name="theme-color" content="#020617" />
  
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>

    /* ======================================================
       ISOLATION TOTALE DU MINI JEU POUR NE PAS TOUCHER style.css
       ====================================================== */

    #game-app * {
      box-sizing: border-box !important;
      font-family: inherit;
    }

    /* Empêche style.css d'appliquer ses styles .card */
    .k-card, 
    .k-card * {
      all: unset;
      box-sizing: border-box;
      display: block;
    }

    :root {
      --card-width: 80px;
      --card-height: 114px;
      --card-width-mob: 60px;
      --card-height-mob: 86px;
    }

    #game-app {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 120px auto 40px;
      padding: 20px;
      background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      min-height: 750px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 10px;
      z-index: 2;
      position: relative;
    }

    .game-logo {
      font-family: 'Bebas Neue';
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(212,175,55,0.3);
    }

    .round-indicator {
      background: rgba(255,255,255,0.05);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .lives-container {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-top: 5px;
      height: 20px;
    }

    .star {
      color: #334155;
      font-size: 1rem;
      transition: all 0.4s;
    }

    .star.active {
      color: var(--gold);
      transform: scale(1.1);
      text-shadow: 0 0 8px rgba(212,175,55,0.6);
    }

    .opponents-zone {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 10px 0;
      min-height: 110px;
    }

    .opponent {
      position: relative;
      width: 90px;
      text-align: center;
      transition: opacity 0.5s;
    }

    .opponent.active-turn .avatar {
      border-color: var(--gold);
      box-shadow: 0 0 20px var(--gold);
      transform: scale(1.05);
    }

    .avatar {
      width: 56px;
      height: 56px;
      background: #1e293b;
      border-radius: 50%;
      margin: 0 auto 8px;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      position: relative;
      overflow: hidden;
    }

    .battle-field {
      flex-grow: 1;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin: 15px 0;
      position: relative;
      min-height: 200px;
    }

    .slot {
      width: var(--card-width);
      height: var(--card-height);
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s;
      position: relative;
    }

    .slot-label {
      position: absolute;
      bottom: -25px;
      width: 120%;
      left: -10%;
      text-align: center;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .player-zone {
      text-align: center;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .my-hand {
      display: flex;
      justify-content: center;
      gap: -10px;
      padding: 15px 10px;
      margin-top: 10px;
      min-height: 130px;
      overflow-x: auto;
    }

    /* ========================================================
       CARTES DU MINI JEU, CLASSE ISOLÉE .k-card
       ======================================================== */

    .k-card {
      width: var(--card-width);
      height: var(--card-height);
      background: #0f172a;
      border-radius: 8px;
      position: relative;
      box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
      cursor: default;
      overflow: hidden;
    }

    .k-inner {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.1);
      background: #1e293b;
    }

    .k-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    .k-img.loaded {
      opacity: 1;
    }

    .k-fallback {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }

    .card-played {
      animation: dropIn 0.4s forwards;
      width: var(--card-width);
      height: var(--card-height);
      z-index: 10;
    }

    @keyframes dropIn {
      0% { transform: scale(1.5) rotate(15deg) translateY(-50px); opacity: 0; }
      100% { transform: scale(1.1) rotate(0deg) translateY(0); opacity: 1; }
    }

    .game-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(10px);
      z-index: 5000 !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 20px;
      text-align: center;
    }

    .game-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 600px) {
      #game-app {
        padding: 10px;
        border-radius: 0;
        margin-top: 100px;
      }
      .k-card,
      .slot,
      .card-played {
        width: var(--card-width-mob);
        height: var(--card-height-mob);
      }
    }

  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="KYRAN">
      </a>
      <nav aria-label="Navigation">
        <ul id="menu-principal">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="regle.html">Règles</a></li>
          <li><a href="minijeu.html" aria-current="page" class="accent">Jeu Complet</a></li>
        </ul>
      </nav>
      <button class="nav-toggle"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <section id="mini-jeu-section" style="padding: 40px 0;">
      <div class="container">
        
        <div id="game-app">

          <div class="game-header">
            <div class="game-logo">KYRAN</div>
            <div class="round-indicator" id="round-display">MANCHE 1</div>
          </div>

          <div id="opponents-zone" class="opponents-zone"></div>

          <div id="battle-field" class="battle-field">
            <div style="color:rgba(255,255,255,0.03);
                        font-family:'Bebas Neue';
                        font-size:5rem;
                        position:absolute;
                        pointer-events:none;
                        z-index:0;">KYRAN</div>
          </div>

          <div class="player-zone">
            <div id="player-status" style="height:20px; color:#94a3b8; font-size:0.9rem; font-weight:600; margin-bottom:5px;">En attente...</div>
            <div class="lives-container" id="my-lives"></div>

            <div class="my-info-bar" style="display:flex; justify-content:center; gap:40px; margin-top:10px;">
              <div class="stat-box">
                <div class="stat-label">Mon Pari</div>
                <div class="stat-value gold" id="my-bet-display">-</div>
              </div>

              <div class="stat-box">
                <div class="stat-label">Plis Gagnés</div>
                <div class="stat-value" id="my-tricks-display">0</div>
              </div>
            </div>

            <div id="my-hand" class="my-hand"></div>
          </div>

          <!-- Overlays -->
          <div id="setup-overlay" class="game-overlay active">
            <div class="overlay-title">NOUVELLE PARTIE</div>
            <div class="overlay-sub">
              Survivez à 7 manches.<br>
              <span style="color:#ef4444; font-weight:bold;">MORT SUBITE :</span> 0 vie = Élimination immédiate.
            </div>

            <div style="margin:20px 0; width:100%;">
              <label style="color:var(--gold); display:block; margin-bottom:15px; font-weight:600;">JOUEURS</label>
              <div style="display:flex; gap:15px; justify-content:center;">
                <button class="btn" onclick="setPlayers(3); startGame()">3</button>
                <button class="btn" onclick="setPlayers(4); startGame()">4</button>
                <button class="btn" onclick="setPlayers(5); startGame()">5</button>
                <button class="btn" onclick="setPlayers(6); startGame()">6</button>
              </div>
            </div>
          </div>

          <div id="bet-overlay" class="game-overlay">
            <div class="overlay-title">FAITES VOS JEUX</div>
            <div class="overlay-sub" id="bet-instruction">Pari ?</div>
            <div id="bet-hand-preview" style="display:flex; gap:5px; justify-content:center; margin-bottom:30px;"></div>
            <div id="bet-buttons-container" class="bet-grid" style="width:100%; max-width:450px;"></div>
          </div>

          <div id="mystic-choice-overlay" class="game-overlay" style="z-index:6000;">
            <div class="overlay-title" style="margin-bottom:20px;">CARTE MYSTIQUE</div>
            <div class="overlay-sub">Choisissez la valeur.</div>
            <div style="display:flex; gap:40px; justify-content:center; margin-top:30px;">
              <button class="btn" style="width:100px; height:100px; border-radius:50%;" onclick="resolveMysticChoice(0)">0</button>
              <button class="btn" style="width:100px; height:100px; border-radius:50%;" onclick="resolveMysticChoice(37)">37</button>
            </div>
          </div>

          <div id="end-overlay" class="game-overlay">
            <div class="overlay-title" id="end-title">FIN DE MANCHE</div>
            <div id="end-summary" style="margin-bottom:30px; font-size:1.1rem; color:#fff;"></div>
            <button class="btn" id="next-round-btn" onclick="nextRoundSetup()">SUIVANT</button>
          </div>

        </div>

      </div>
    </section>
  </main>
<script>

  const ROUNDS_CONFIG = [7,6,5,4,3,2,1];

  const GAME = {
    playersCount: 4,
    roundIndex: 0,
    deck: [],
    players: [],
    turnOrder: [],
    currentTrickCards: [],
    nextTrickLeader: 0,
    tempMysticData: null,
    isMysticRound: false
  };

  const AI_PERSONAS = [
    { name: "Oraculus", emoji: "🔮", style: "balanced" },
    { name: "Titan", emoji: "🛡️", style: "aggressive" },
    { name: "Viper", emoji: "🐍", style: "tricky" },
    { name: "Loki", emoji: "🎭", style: "chaotic" },
    { name: "Gaia", emoji: "🌿", style: "passive" }
  ];

  function setPlayers(n) {
    GAME.playersCount = n;
  }

  function createDeck() {
    let d = [];
    for (let i=1; i<=36; i++) d.push(i);
    d.push(37);
    return d.sort(() => Math.random() - 0.5);
  }

  /* ============================================================
     CREATION DES CARTES .k-card AU LIEU DE .card
     ============================================================ */

  function createCardElement(val, isBack) {
    const el = document.createElement('div');
    el.className = 'k-card';

    const inner = document.createElement('div');
    inner.className = 'k-inner';

    const img = document.createElement('img');
    img.className = 'k-img';

    const fallback = document.createElement('div');
    fallback.className = 'k-fallback';

    if (isBack) {
      fallback.innerHTML = '<img src="logo.png" style="width:60%; opacity:0.8;">';
      img.src = 'back.jpg';
    } else {
      fallback.innerHTML = `
        <div style="font-size:2rem; font-family:'Bebas Neue';">${val === 37 ? 'M' : val}</div>
      `;
      img.src = `card-${val}.jpg`;
    }

    img.onload = () => img.classList.add('loaded');
    img.onerror = () => {};

    inner.appendChild(fallback);
    inner.appendChild(img);
    el.appendChild(inner);

    return el;
  }

  /* =======================================================
     DEMARRAGE
     ======================================================= */

  function startGame() {
    document.querySelectorAll('.game-overlay').forEach(o => o.classList.remove('active'));
    GAME.roundIndex = 0;
    GAME.players = [];
    GAME.nextTrickLeader = 0;

    GAME.players.push({ id:0, name:'TOI', type:'human', lives:5, hand:[], tricks:0, bet:0, alive:true });

    let personas = [...AI_PERSONAS].sort(() => Math.random() - .5);
    for (let i=1; i<GAME.playersCount; i++) {
      let p = personas[i-1];
      GAME.players.push({ id:i, name:p.name, emoji:p.emoji, persona:p, type:'ai', lives:5, hand:[], tricks:0, bet:0, alive:true });
    }

    startRound();
  }

  function startRound() {
    let nb = ROUNDS_CONFIG[GAME.roundIndex];
    GAME.isMysticRound = (GAME.roundIndex === ROUNDS_CONFIG.length - 1);

    GAME.deck = createDeck();

    GAME.players.forEach(p => {
      p.hand = [];
      p.tricks = 0;
      p.bet = 0;
      if (p.alive) {
        for (let i=0; i<nb; i++) p.hand.push(GAME.deck.pop());
        if (p.id===0 && !GAME.isMysticRound) p.hand.sort((a,b)=>a-b);
      }
    });

    document.getElementById('round-display').innerText =
      GAME.isMysticRound
      ? 'MYSTIQUE'
      : `MANCHE ${GAME.roundIndex+1}`;

    renderTableSetup();
    startBettingPhase();
  }

  function renderTableSetup() {
    const opp = document.getElementById('opponents-zone');
    opp.innerHTML = '';

    const bf = document.getElementById('battle-field');
    bf.innerHTML = `
      <div style="color:rgba(255,255,255,0.03);
                  font-family:'Bebas Neue';
                  font-size:5rem;
                  position:absolute;
                  pointer-events:none;">KYRAN</div>`;

    renderLives(0);

    for (let i=1; i<GAME.players.length; i++) {
      let p = GAME.players[i];
      let div = document.createElement('div');
      div.className = p.alive ? 'opponent' : 'opponent eliminated';
      div.style.opacity = p.alive ? 1 : 0.3;
      div.id = 'opp-'+p.id;

      div.innerHTML = `
        <div class="chat-bubble" id="bubble-${p.id}"></div>
        <div class="avatar">${p.emoji}<div class="opp-bet-badge" id="badge-${p.id}">?</div></div>
        <div class="opp-name">${p.name}</div>
        <div class="lives-container" id="lives-${p.id}"></div>
      `;
      opp.appendChild(div);
      renderLives(p.id);

      let wrapper = document.createElement('div');
      wrapper.innerHTML = `
        <div class="slot" id="slot-${p.id}"></div>
        <div class="slot-label">${p.name}</div>
      `;
      bf.appendChild(wrapper);
    }

    let my = document.createElement('div');
    my.innerHTML = `
      <div class="slot" id="slot-0"></div>
      <div class="slot-label" style="color:var(--gold)">TOI</div>
    `;
    bf.appendChild(my);
  }

  function renderLives(id) {
    let p = GAME.players[id];
    let target = id===0 ? document.getElementById('my-lives') : document.getElementById('lives-'+id);
    let out = '';
    for (let i=0; i<5; i++) out += `<span class="star ${i<p.lives?'active':''}">★</span>`;
    target.innerHTML = out;
  }

  /* =======================================================
     PARIS
     ======================================================= */

  function startBettingPhase() {
    const overlay = document.getElementById('bet-overlay');
    const cont = document.getElementById('bet-buttons-container');
    const prev = document.getElementById('bet-hand-preview');
    cont.innerHTML = '';
    prev.innerHTML = '';

    let nb = ROUNDS_CONFIG[GAME.roundIndex];

    if (GAME.isMysticRound) {
      GAME.players.forEach(p => {
        if (p.id!==0 && p.alive) {
          let card = createCardElement(p.hand[0], false);
          prev.appendChild(card);
        }
      });
      let my = createCardElement(0, true);
      prev.appendChild(my);
    } else {
      GAME.players[0].hand.forEach(v => {
        let c = createCardElement(v, false);
        prev.appendChild(c);
      });
    }

    for (let i=0; i<=nb; i++) {
      let btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = i;
      btn.onclick = () => confirmBet(i);
      cont.appendChild(btn);
    }

    GAME.players.forEach(p => {
      if (p.type==='ai' && p.alive) {
        let strength = evaluateHand(p.hand, nb);
        let variance = (Math.random() * 0.4) - 0.2;
        let target = Math.round((strength + variance) * nb);
        p.bet = Math.max(0, Math.min(target, nb));
        document.getElementById('badge-'+p.id).innerText = p.bet;
      }
    });

    overlay.classList.add('active');
  }

  function evaluateHand(hand, total) {
    let pts = 0;
    hand.forEach(c => {
      if (c===37) pts+=10;
      else if (c>30) pts+=4;
      else if (c>20) pts+=2;
      else if (c<5) pts+=0.5;
    });
    return Math.min(pts / (total*3.5), 1);
  }

  function confirmBet(v) {
    GAME.players[0].bet = v;
    document.getElementById('my-bet-display').innerText = v;
    document.getElementById('bet-overlay').classList.remove('active');
    startTrick();
  }

  /* =======================================================
     TOUR ET JEU
     ======================================================= */

  function startTrick() {
    GAME.currentTrickCards = [];
    document.querySelectorAll('.slot').forEach(s => {
      s.innerHTML = '';
      s.classList.remove('winner-glow');
    });

    GAME.turnOrder = [];
    let s = GAME.nextTrickLeader;
    let count = 0;
    while ((!GAME.players[s] || !GAME.players[s].alive) && count<10) {
      s = (s+1) % GAME.playersCount;
      count++;
    }
    GAME.nextTrickLeader = s;

    for (let i=0; i<GAME.playersCount; i++) {
      let pid = (s+i) % GAME.playersCount;
      if (GAME.players[pid].alive) GAME.turnOrder.push(pid);
    }

    updateHandUI();
    nextTurn();
  }

  function updateHandUI() {
    const h = document.getElementById('my-hand');
    h.innerHTML = '';
    GAME.players[0].hand.forEach((v,i) => {
      let c = createCardElement(v, GAME.isMysticRound);
      c.classList.add('playable');
      c.onclick = () => humanPlayCard(i, v);
      h.appendChild(c);
    });
  }

  async function nextTurn() {
    if (GAME.turnOrder.length===0) return resolveTrick();

    let pid = GAME.turnOrder.shift();
    document.querySelectorAll('.opponent').forEach(o => o.classList.remove('active-turn'));

    if (pid!==0) document.getElementById('opp-'+pid).classList.add('active-turn');

    if (pid===0) {
      document.getElementById('player-status').innerText = "C'EST A VOUS";
      document.getElementById('player-status').style.color = "var(--gold)";
    } else {
      document.getElementById('player-status').innerText = GAME.players[pid].name + " joue...";
      document.getElementById('player-status').style.color = "#94a3b8";
      await new Promise(r => setTimeout(r, 600 + Math.random()*500));
      aiPlayCard(pid);
    }
  }

  function humanPlayCard(idx, v) {
    if (v===37 && !GAME.isMysticRound) {
      GAME.tempMysticData = { idx:idx, val:v };
      document.getElementById('mystic-choice-overlay').classList.add('active');
      return;
    }
    playCardFinal(0, idx, v, v);
  }

  function resolveMysticChoice(v) {
    document.getElementById('mystic-choice-overlay').classList.remove('active');
    if (GAME.tempMysticData) {
      playCardFinal(0, GAME.tempMysticData.idx, v, GAME.tempMysticData.val);
      GAME.tempMysticData = null;
    }
  }

  function aiPlayCard(pid) {
    let p = GAME.players[pid];
    let want = p.bet > p.tricks;
    p.hand.sort((a,b)=>a-b);
    let card, idx;

    if (GAME.currentTrickCards.length===0) {
      if (want) { card = p.hand[p.hand.length-1]; idx = p.hand.length-1; }
      else { card = p.hand[0]; idx = 0; }
    } else {
      let max = Math.max(...GAME.currentTrickCards.map(c => c.effVal));
      if (want) {
        let win = p.hand.find(c => ((c===37?37:c) > max));
        if (win!==undefined) { card=win; idx=p.hand.indexOf(win); }
        else { card=p.hand[0]; idx=0; }
      } else {
        let lose = p.hand.filter(c => ((c===37?0:c) < max)).pop();
        if (lose!==undefined) { card=lose; idx=p.hand.indexOf(lose); }
        else { card=p.hand[p.hand.length-1]; idx=p.hand.length-1; }
      }
    }

    let eff = card;
    if (card===37) eff = want ? 37 : 0;

    playCardFinal(pid, idx, eff, card);
  }

  function playCardFinal(pid, idx, effVal, displayVal) {
    GAME.players[pid].hand.splice(idx,1);
    if (pid===0) updateHandUI();

    let s = document.getElementById('slot-'+pid);
    s.innerHTML = '';
    let c = createCardElement(displayVal, false);
    c.classList.add('card-played');
    s.appendChild(c);

    GAME.currentTrickCards.push({ pid:pid, effVal:effVal, displayVal:displayVal });
    nextTurn();
  }

  async function resolveTrick() {
    await new Promise(r => setTimeout(r, 800));

    let w = GAME.currentTrickCards.reduce((p,c)=> c.effVal>p.effVal?c:p);
    let wid = w.pid;

    document.getElementById('slot-'+wid).classList.add('winner-glow');
    GAME.players[wid].tricks++;
    GAME.nextTrickLeader = wid;

    document.getElementById('player-status').innerText =
      wid===0 ? "VOUS REMPORTEZ LE PLI !" : GAME.players[wid].name + " remporte le pli";
    document.getElementById('player-status').style.color =
      wid===0 ? "#4ade80" : "#fff";

    if (wid===0) {
      document.getElementById('my-tricks-display').innerText = GAME.players[0].tricks;
    }

    await new Promise(r => setTimeout(r, 1500));

    if (GAME.players[0].hand.length===0) endRoundSummary();
    else startTrick();
  }

  function endRoundSummary() {
    let s = "<ul style='list-style:none; padding:0;'>";
    let sudden = false;

    GAME.players.forEach(p => {
      if (!p.alive) return;
      let diff = Math.abs(p.bet - p.tricks);
      p.lives -= diff;
      if (p.lives<=0) { p.lives=0; p.alive=false; sudden=true; }
      renderLives(p.id);

      let c = diff===0 ? "#4ade80" : "#ef4444";
      let r = diff===0 ? "PARFAIT" : "-"+diff;
      s += `
        <li style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:5px;">
          <span>${p.name} (${p.bet}/${p.tricks})</span>
          <strong style="color:${c}">${r}</strong>
        </li>`;
    });

    s += "</ul>";
    document.getElementById('end-summary').innerHTML = s;

    let btn = document.getElementById('next-round-btn');
    let title = document.getElementById('end-title');

    if (sudden || GAME.roundIndex >= ROUNDS_CONFIG.length-1) {
      let max = Math.max(...GAME.players.map(p=>p.lives));
      let winners = GAME.players.filter(p=>p.lives===max);
      let uwin = winners.some(w=>w.id===0);

      if (uwin) {
        title.innerText = "VICTOIRE";
        document.getElementById('end-summary').innerHTML +=
          "<div style='margin-top:20px; color:var(--gold); font-weight:bold;'>Tu es le Maitre des Mystiques</div>";
      } else {
        title.innerText = "PERDU";
        document.getElementById('end-summary').innerHTML +=
          "<div style='margin-top:20px;'>Gagnants : "+winners.map(w=>w.name).join(', ')+"</div>";
      }

      btn.innerText = "REJOUER";
      btn.onclick = () => location.reload();

    } else {
      btn.innerText = "SUIVANT";
      btn.onclick = nextRoundSetup;
    }

    document.getElementById('end-overlay').classList.add('active');
  }

  function nextRoundSetup() {
    document.getElementById('end-overlay').classList.remove('active');
    GAME.roundIndex++;
    startRound();
  }

  (function() {
    const t = document.querySelector('.nav-toggle');
    const b = document.body;
    if (t) t.addEventListener('click', ()=> b.classList.toggle('menu-open'));
  })();

</script>
